version: 2
updates:
  # GitHub Actions used across all workflows (resolves SHA pins).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # pnpm workspace root (schema, authz, service). Must point at the root, where
  # pnpm-lock.yaml lives, or Dependabot bumps package.json without the lockfile.
  - package-ecosystem: npm
    directory: /packages/js
    schedule:
      interval: weekly

  # Go schema package modules.
  - package-ecosystem: gomod
    directory: /packages/go/schema
    schedule:
      interval: weekly

  # Flutter package (pub).
  - package-ecosystem: pub
    directory: /packages/flutter
    schedule:
      interval: weekly

  # Dart proto package (pub).
  - package-ecosystem: pub
    directory: /packages/dart/proto
    schedule:
      interval: weekly

  # Dart rtc package (pub).
  - package-ecosystem: pub
    directory: /packages/dart/rtc
    schedule:
      interval: weekly
