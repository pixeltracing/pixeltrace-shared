version: 2
updates:
  # GitHub Actions used across all workflows (resolves SHA pins).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # TS schema package (npm / pnpm).
  - package-ecosystem: npm
    directory: /packages/js/schema
    schedule:
      interval: weekly

  # Go schema package modules.
  - package-ecosystem: gomod
    directory: /packages/go/schema
    schedule:
      interval: weekly

  # Flutter package (pub).
  - package-ecosystem: pub
    directory: /packages/flutter
    schedule:
      interval: weekly

  # Dart proto package (pub).
  - package-ecosystem: pub
    directory: /packages/dart/proto
    schedule:
      interval: weekly

  # Dart rtc package (pub).
  - package-ecosystem: pub
    directory: /packages/dart/rtc
    schedule:
      interval: weekly
