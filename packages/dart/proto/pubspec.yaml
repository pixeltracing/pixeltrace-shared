name: pixeltrace_proto
description: "Generated Dart protobuf bindings and Connect clients for the Pixeltrace API."
version: 0.0.1
homepage: https://pixeltrace.dev/
repository: https://github.com/pixeltracing/pixeltrace-shared/tree/main/packages/dart/proto
issue_tracker: https://github.com/pixeltracing/pixeltrace-shared/issues

# Disable pub.dev publishing for now.
publish_to: none

environment:
  sdk: ^3.11.4

dependencies:
  connectrpc: ^2.0.0
  fixnum: ^1.1.1
  protobuf: ^6.1.0

dev_dependencies:
  lints: ^6.1.0
  protoc_plugin: ^22.5.0
