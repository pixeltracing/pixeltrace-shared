name: pixeltrace_flutter
description: "Session recording for Flutter web apps."
version: 0.0.1
homepage: https://pixeltrace.dev/
repository: https://github.com/pixeltracing/pixeltrace-shared/tree/main/packages/flutter
issue_tracker: https://github.com/pixeltracing/pixeltrace-shared/issues

# Disable pub.dev publishing for now.
publish_to: none

environment:
  sdk: ^3.11.4
  flutter: ">=1.17.0"

dependencies:
  connectrpc: ^1.0.0
  flutter:
    sdk: flutter
  logging: ^1.3.0
  meta: ^1.17.0
  pixeltrace_proto:
    path: ../dart/proto
  pixeltrace_rtc:
    path: ../dart/rtc
  web: ^1.1.1

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0