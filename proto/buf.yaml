# Buf module definition for the Pixeltrace protobuf schema.

version: v2
modules:
  - path: .
deps:
  - buf.build/googleapis/googleapis
lint:
  use:
    - STANDARD
  except:
    # Enum values are siblings of their enum, so a value name must be unique
    # across the top-level enums of a package; the compiler rejects a duplicate
    # regardless of target language. Top-level enums sharing a package are
    # prefixed for that reason. Nested enums, and ErrorReason (alone in its
    # package), use bare values such as `UNSPECIFIED = 0`, which these two
    # rules would otherwise reject.
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
breaking:
  use:
    - PACKAGE
